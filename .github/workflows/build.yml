name: Build route pages

# build.js turns index.html into one page per route, and writes sitemap.xml.
# Those files are committed, because GitHub Pages serves the repository as it
# is, which means they can go stale if someone edits index.html and forgets to
# run the build. This runs it for them.
on:
  push:
    branches: [main]
    paths:
      # Only what the generated files are made from. Editing a .pptx or the
      # README cannot change them, so there is nothing to rebuild.
      - 'index.html'
      - 'js/lessons.js'
      - 'js/lesson-view.js'
      - 'build.js'
      # The PDFs are in the sitemap, dated by their last commit.
      - 'slides/*.pdf'
      - 'worksheets/*.pdf'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # and by hand, from the Actions tab

# A second push while this is running would race the first to commit.
concurrency:
  group: build-route-pages
  cancel-in-progress: false

permissions:
  contents: write           # the repository default is read; this job commits

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The sitemap dates each file by its last commit, which a shallow
          # clone cannot see. build.js leaves lastmod out rather than guess.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate the route pages
        run: node build.js

      - name: Commit them if they changed
        run: |
          # status, not diff: a brand new page (a new lesson, or the first Thai
          # copy of one) is an untracked file, which git diff does not see.
          if [ -z "$(git status --porcelain)" ]; then
            echo "Route pages already match index.html. Nothing to do."
            exit 0
          fi

          echo "Changed:"
          git status --porcelain | sed 's/^/  /'

          # Committed as the repository owner rather than github-actions[bot],
          # so the contributor list stays one person.
          git config user.name  "yanj428"
          git config user.email "yanita.jantaboot@gmail.com"

          git add -A
          git commit -m "Rebuild the route pages

          Generated by build.js from index.html. Committed automatically
          because GitHub Pages serves the repository as it is."
          # Someone may have pushed while this ran: the concurrency group queues
          # runs but does not stop a push landing in between, and a plain push
          # would then be rejected as non-fast-forward.
          git pull --rebase origin main

          # A push made with GITHUB_TOKEN does not start another workflow run,
          # so this cannot loop.
          git push
